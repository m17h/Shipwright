; Stable Ship of Harkinian ReShade preset.
; Copy this file to x64\Release\ReShadePreset.ini after changing it.
; Third-party ReShade binaries and shader packages are intentionally not stored
; in this repository.

[GENERAL]
Techniques=Lightroom@qUINT_lightroom.fx,Bloom@qUINT_bloom.fx,DELC_Sharpen@qUINT_sharp.fx
TechniqueSorting=Lightroom@qUINT_lightroom.fx,Bloom@qUINT_bloom.fx,DELC_Sharpen@qUINT_sharp.fx

[qUINT_bloom.fx]
BLOOM_INTENSITY=0.350000
BLOOM_CURVE=2.000000
BLOOM_SAT=1.200000
BLOOM_ADAPT_STRENGTH=0.300000
BLOOM_ADAPT_EXPOSURE=0.000000
BLOOM_ADAPT_SPEED=2.000000
BLOOM_ADAPT_MODE=0
BLOOM_TONEMAP_COMPRESSION=4.000000

[qUINT_lightroom.fx]
LIGHTROOM_GLOBAL_EXPOSURE=0.000000
LIGHTROOM_GLOBAL_GAMMA=0.010000
LIGHTROOM_GLOBAL_BLACKS_CURVE=0.010000
LIGHTROOM_GLOBAL_SHADOWS_CURVE=0.020000
LIGHTROOM_GLOBAL_MIDTONES_CURVE=0.010000
LIGHTROOM_GLOBAL_HIGHLIGHTS_CURVE=-0.030000
LIGHTROOM_GLOBAL_WHITES_CURVE=-0.010000
LIGHTROOM_GLOBAL_CONTRAST=0.080000
LIGHTROOM_GLOBAL_SATURATION=0.020000
LIGHTROOM_GLOBAL_VIBRANCE=0.080000
LIGHTROOM_GLOBAL_TEMPERATURE=0.010000
LIGHTROOM_GLOBAL_TINT=0.000000
LIGHTROOM_ENABLE_VIGNETTE=0

[qUINT_sharp.fx]
SHARP_STRENGTH=0.350000
DEPTH_MASK_ENABLE=0
RMS_MASK_ENABLE=1
SHARPEN_MODE=1
